name: Daily Note & Paid Info Pipeline

on:
  workflow_dispatch:

  schedule:
    # 日本時間 09:30 - 09:00の記事生成後に1日1回だけ実行
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: ai-trend-blog-daily-content
  cancel-in-progress: false

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate free note draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_note_draft.py

      - name: Collect paid info candidates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python collect_paid_info_candidates.py

      - name: Verify paid info candidates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python verify_paid_info_candidates.py

      - name: Generate paid note draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_paid_note_draft.py

      - name: Review free and paid note drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python review_note_drafts.py

      - name: Move paid note drafts to private repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python sync_paid_note_to_private.py

      - name: Commit generated files safely
        run: bash .github/scripts/safe-commit-push.sh 'Update daily note and paid info pipeline'
