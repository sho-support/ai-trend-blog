name: Check existing Buffer Pinterest connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/monoyori-buffer-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monoyori-buffer-read-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read channel availability without posting or changing accounts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PYTHONPATH: portal-tools
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from datetime import datetime,timezone
          from publish_product_launch import graphql_client,target_organization
          call=graphql_client(os.environ['BUFFER_API_KEY'])
          org=target_organization(call)
          data=call('query($id:OrganizationId!) { channels(input:{organizationId:$id}) { service isDisconnected isLocked } }',{'id':org})
          channels=data.get('channels',[])
          pins=[x for x in channels if x.get('service')=='pinterest']
          report={'checked_at':datetime.now(timezone.utc).isoformat(),'method':'existing_buffer_api_read_only','product_x_identity_verified':True,'total_channels':len(channels),'pinterest_channels':len(pins),'pinterest_available':any(not x.get('isDisconnected') and not x.get('isLocked') for x in pins),'account_registration_history':'unknown','mutation_performed':False}
          Path('growth/buffer-connection-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\\n'.replace('\\n','\n'))
          print(json.dumps(report))
          PY
      - name: Preserve connection check
        run: bash .github/scripts/safe-commit-push.sh 'Record read-only Buffer Pinterest availability'
