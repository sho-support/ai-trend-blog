name: Publish water buying guide with original comparison graphic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/monoyori-water-launch.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monoyori-reviewed-story-launch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the real public article with Chromium before any post
        run: |
          npm install --prefix /tmp/story-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          /tmp/story-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/story-browser/node_modules node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch();try{const page=await browser.newPage();const url='https://sho-monoyori-review.zodiac-suu.workers.dev/products/stories/sparkling-water-case-cost';const response=await page.goto(url);await page.waitForLoadState('networkidle');const html=await page.content();if(response.status()!==200||!html.includes('data-buy=')||html.includes('review-mode.js'))throw Error('Public article not ready');fs.writeFileSync('/tmp/story-proof.json',JSON.stringify({url:page.url(),status:response.status(),html,checked_at:Date.now()/1000}));}finally{await browser.close();}})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish the reviewed article once to the existing product X channel
        env:
          STORY_PUBLIC_PROOF: /tmp/story-proof.json
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python portal-tools/publish_water_launch.py
      - name: Preserve the actual attempt even when delivery is uncertain
        if: always()
        run: |
          if test -f growth/water-launch-receipt.json; then
            bash .github/scripts/safe-commit-push.sh 'Record Monoyori article photo delivery result'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monoyori-water-launch-receipt
          path: growth/water-launch-receipt.json
          if-no-files-found: ignore
