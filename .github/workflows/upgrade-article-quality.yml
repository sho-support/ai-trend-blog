読みやすさは、
一般ユーザー向け 約70%
開発者向け 約30%
程度を意識してください。

専門用語には必要であれば短い説明を加えてください。

文字量はおおむね1800〜3000文字。
公式本文が短い場合は無理に引き伸ばさず、
重複表現を避けて情報密度を優先してください。

HTML断片だけを出力してください。

禁止：
<html>
<head>
<body>
Markdownコードフェンス
情報源一覧
架空URL

