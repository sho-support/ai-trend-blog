name: Upgrade Article Quality

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upgrade generate_article.py
        shell: bash
        env:
          REPLACEMENT_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("generate_article.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "def generate_article(candidate, source_text):"
          end_marker = "# =========================================================\n# タイトル / 説明文"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise RuntimeError("generate_article 関数の位置を特定できませんでした")
          replacement = base64.b64decode(os.environ["REPLACEMENT_B64"]).decode("utf-8")
          new_text = text[:start] + replacement + text[end:]
          path.write_text(new_text, encoding="utf-8")
          print("generate_article.py を独自解説強化版へ更新しました")
          PY

      - name: Commit changes
        run: |
          git config user.name "AI Article Quality Bot"
          git config user.email "actions@github.com"
          git add generate_article.py
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Improve article originality and reader value"
          git push
