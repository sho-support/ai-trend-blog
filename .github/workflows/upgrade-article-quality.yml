<h2>向いている人・まだ様子見でいい人</h2>
<p>公式情報に基づいて、利用価値が高そうなケースと、急いで使う必要がないケースを分ける。</p>

<h2>実際に試すなら</h2>
<p>公式本文に導入方法・利用方法・対象サービスがある場合だけ、最初の一歩を具体的に整理する。確認できない場合は無理に手順を作らない。</p>

<h2>注意点</h2>
<p>提供地域、料金、制約、ベータ版、対象者、未確定情報などを整理する。</p>

