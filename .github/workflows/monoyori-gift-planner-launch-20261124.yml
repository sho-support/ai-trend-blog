name: Introduce gift quantity planner once with original checklist graphic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/monoyori-gift-planner-launch-20261124.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monoyori-reviewed-story-launch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the real public article with Chromium before any post
        run: |
          npm install --prefix /tmp/story-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          /tmp/story-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/story-browser/node_modules node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch();try{
            const page=await browser.newPage();const base='https://sho-monoyori-review.zodiac-suu.workers.dev';
            const target=base+'/products/tools/gift-quantity';
            for(const width of [390,1440]){
              await page.setViewportSize({width,height:1000});const response=await page.goto(target+'?qa=1');
              if(response.status()!==200||await page.locator('link[rel="canonical"]').getAttribute('href')!==target||await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth))throw Error('Planner route/layout failed');
              await page.locator('#people').fill('25');
              if(!(await page.locator('#gift-result').innerText()).includes('必要 2箱')||!(await page.locator('#gift-result').innerText()).includes('余り 30個'))throw Error('Wrong planner quantities');
              await page.locator('#people').fill('0');
              if(!(await page.locator('#gift-result').innerText()).includes('入力を確認'))throw Error('Invalid quantity accepted');
              if(await page.locator('a[href*="yokumoku-delices-gift"]').count()<1)throw Error('Missing product guide link');
            }
            const url=base+'/products/stories/yokumoku-delices-gift';
            for(const width of [390,1440]){await page.setViewportSize({width,height:1000});const response=await page.goto(url+'?qa=1');await page.waitForLoadState('networkidle');
              const v=await page.evaluate(()=>({canonical:document.querySelector('link[rel="canonical"]')?.href,photo:[...document.querySelectorAll('.story-cover img')].some(x=>x.complete&&x.naturalWidth>0),buy:document.querySelectorAll('[data-buy]').length,overflow:document.documentElement.scrollWidth>innerWidth,text:document.querySelector('.product-story')?.innerText||'',blocked:!!document.querySelector('script[src*="review-mode"]')}));
              if(response.status()!==200||v.canonical!==url||!v.photo||!v.buy||v.overflow||v.blocked||!v.text.includes('25個')||!v.text.includes('クリスマス'))throw Error('Public article not ready');
            }
            const img=await page.goto('https://raw.githubusercontent.com/sho-support/ai-trend-blog/main/growth/social-assets/gift-check-pinterest.png');
            if(img.status()!==200||!img.headers()['content-type'].includes('image/png'))throw Error('Campaign image unavailable');
            fs.writeFileSync('/tmp/story-proof.json',JSON.stringify({url:target,status:200,passed:true,checked_at:Date.now()/1000}));
          }finally{await browser.close();}})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish the reviewed article once to the existing product X channel
        env:
          STORY_PUBLIC_PROOF: /tmp/story-proof.json
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python portal-tools/publish_gift_planner_launch_20261124.py
      - name: Preserve the actual attempt even when delivery is uncertain
        if: always()
        run: |
          if test -f growth/gift-planner-launch-20261124-receipt.json; then
            bash .github/scripts/safe-commit-push.sh 'Record Monoyori article photo delivery result'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monoyori-gift-planner-launch-20261124-receipt
          path: growth/gift-planner-launch-20261124-receipt.json
          if-no-files-found: ignore
