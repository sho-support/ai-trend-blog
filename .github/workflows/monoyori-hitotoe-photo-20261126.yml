name: Introduce Hitotoe once using verified actual product photograph
on:
  push:
    branches: [main]
    paths: ['.github/workflows/monoyori-hitotoe-photo-20261126.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monoyori-reviewed-story-launch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the product, photograph and purchase path before delivery
        run: |
          npm install --prefix /tmp/story-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          /tmp/story-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/story-browser/node_modules node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const m=JSON.parse(fs.readFileSync('growth/hitotoe-photo-launch-20261126.json'));const browser=await chromium.launch();
          try{const page=await browser.newPage();
          for(const width of [390,1440]){
            await page.setViewportSize({width,height:1000});const response=await page.goto(m.article_url+'?qa=1');await page.waitForLoadState('networkidle');
            const v=await page.evaluate(()=>({canonical:document.querySelector('link[rel="canonical"]')?.href,photo:[...document.querySelectorAll('#product-detail img')].some(x=>x.complete&&x.naturalWidth>0),buy:document.querySelectorAll('#product-detail [data-buy]').length,overflow:document.documentElement.scrollWidth>innerWidth,text:document.querySelector('#product-detail')?.innerText||'',guide:document.querySelector('.buying-guide')?.innerText||''}));
            if(response.status()!==200||v.canonical!==m.article_url||!v.photo||!v.buy||v.overflow||!v.guide.includes('ケーキ5個')||!v.text.includes('1,650円')||!v.text.includes('3,810円')||!v.text.includes('送料込み商品'))throw Error('Product introduction not ready');
          }
          const img=await page.goto(m.image_url);if(img.status()!==200||!img.headers()['content-type'].startsWith('image/'))throw Error('Actual product photograph unavailable');
          fs.writeFileSync('/tmp/story-proof.json',JSON.stringify({url:m.article_url,status:200,passed:true,checked_at:Date.now()/1000}));
          }finally{await browser.close();}})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Send only inside campaign window after history reconciliation
        env:
          STORY_PUBLIC_PROOF: /tmp/story-proof.json
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python portal-tools/publish_hitotoe_photo_20261126.py
      - name: Preserve attempt without retrying
        if: always()
        run: |
          if test -f growth/hitotoe-photo-launch-20261126-receipt.json; then
            bash .github/scripts/safe-commit-push.sh 'Record Hitotoe photo campaign delivery result'
          fi
