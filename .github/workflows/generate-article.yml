name: Generate AI Article

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_article.py

      - name: Commit generated article
        run: |
          git config user.name "AI Article Bot"
          git config user.email "actions@github.com"

          git add articles/ index.html article_history.json sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "No new article generated."
            exit 0
          fi

          git commit -m "Add AI generated article"
          git push
